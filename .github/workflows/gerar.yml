name: Gerar achadinhos

on:
  schedule:
    - cron: "0 13 * * *"   # 10h em Brasilia
    - cron: "0 20 * * *"   # 17h em Brasilia
  workflow_dispatch:
    inputs:
      links:
        description: "Links do Mercado Livre (um por linha ou separados por ;). Opcional: | preco | preco antigo. Vazio = buscar ofertas."
        required: false
        default: ""

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: gerar
  cancel-in-progress: false

jobs:
  gerar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      - name: Baixar dados anteriores (branch dados)
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash ferramentas/dados.sh baixar

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependencias
        run: |
          pip install -r requirements.txt
          which ffmpeg || (sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg)

      - name: Gerar posts
        env:
          LINKS: ${{ github.event.inputs.links }}
          ML_CLIENT_ID: ${{ secrets.ML_CLIENT_ID }}
          ML_CLIENT_SECRET: ${{ secrets.ML_CLIENT_SECRET }}
          ML_REFRESH_TOKEN: ${{ secrets.ML_REFRESH_TOKEN }}
          TOKEN_KEY: ${{ secrets.TOKEN_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -n "$LINKS" ]; then
            python -m gerador.main links "$LINKS"
          else
            python -m gerador.main auto
          fi

      - name: Guardar dados
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash ferramentas/dados.sh salvar

      - name: Montar site
        run: |
          mkdir -p _site
          cp -r docs/. _site/
          [ -f dados/posts.json ] && cp dados/posts.json _site/ || echo "[]" > _site/posts.json
          [ -d dados/posts ] && cp -r dados/posts _site/ || true

      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

      - id: deploy
        uses: actions/deploy-pages@v5
