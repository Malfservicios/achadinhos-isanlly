# Fabrica o APK do app Achadinhos nos servidores do GitHub e publica em "Releases".
# Link fixo para baixar sempre a ultima versao:
#   https://github.com/Malfservicios/achadinhos-isanlly/releases/latest/download/achadinhos.apk
name: APK de Android

on:
  push:
    branches: [main]
    paths:
      - "android/**"
      - ".github/workflows/android-apk.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Preparar a chave de assinatura (dos Secrets)
        env:
          SIGNING_KEY_BASE64: ${{ secrets.SIGNING_KEY_BASE64 }}
          SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
        run: |
          if [ -z "$SIGNING_KEY_BASE64" ] || [ -z "$SIGNING_PASSWORD" ]; then
            echo "::error::Faltam os secrets SIGNING_KEY_BASE64 e SIGNING_PASSWORD."
            exit 1
          fi
          printf '%s' "$SIGNING_KEY_BASE64" | tr -d ' \r\n\t"' | base64 -d > "$RUNNER_TEMP/firma.p12"
          OUT=$(LC_ALL=C keytool -J-Duser.language=en -list -v -storetype pkcs12 -keystore "$RUNNER_TEMP/firma.p12" -storepass "$SIGNING_PASSWORD" 2>&1 || true)
          ALIAS=$(printf '%s\n' "$OUT" | sed -n 's/^Alias name: //p' | head -n1)
          if [ -z "$ALIAS" ]; then
            printf '%s\n' "$OUT" | grep -iv 'password' | head -n 15
            echo "::error::Nao foi possivel ler a chave de assinatura."
            exit 1
          fi
          echo "SIGNING_KEY_PATH=$RUNNER_TEMP/firma.p12" >> "$GITHUB_ENV"
          echo "SIGNING_KEY_ALIAS=$ALIAS" >> "$GITHUB_ENV"

      - name: Compilar o APK
        env:
          SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
          APP_VERSION_CODE: ${{ github.run_number }}
        run: gradle -p android assembleRelease --no-daemon

      - name: Conferir assinatura
        run: |
          SIGNER="$ANDROID_HOME"/build-tools/$(ls "$ANDROID_HOME"/build-tools | sort -V | tail -n1)/apksigner
          cp android/app/build/outputs/apk/release/app-release.apk achadinhos.apk
          "$SIGNER" verify --print-certs achadinhos.apk | grep -i sha-256

      - name: Publicar em Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "app-v${{ github.run_number }}" achadinhos.apk \
            --repo "$GITHUB_REPOSITORY" --latest \
            --title "App Achadinhos 1.0.${{ github.run_number }}" \
            --notes "Baixe o arquivo achadinhos.apk e instale no Android."
