name: Conectar Mercado Livre

on:
  workflow_dispatch:
    inputs:
      codigo:
        description: "Codigo que aparece no painel depois de autorizar no Mercado Livre"
        required: true

permissions:
  contents: write
  actions: write

jobs:
  conectar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Baixar dados anteriores
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash ferramentas/dados.sh baixar

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Trocar codigo por token
        env:
          CODIGO: ${{ github.event.inputs.codigo }}
          REDIRECT_URI: https://malfservicios.github.io/achadinhos-isanlly/
          ML_CLIENT_ID: ${{ secrets.ML_CLIENT_ID }}
          ML_CLIENT_SECRET: ${{ secrets.ML_CLIENT_SECRET }}
          TOKEN_KEY: ${{ secrets.TOKEN_KEY }}
        run: python -m gerador.main conectar "$CODIGO" "$REDIRECT_URI"

      - name: Guardar token
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash ferramentas/dados.sh salvar

      - name: Buscar as primeiras ofertas
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run gerar.yml --repo "$GITHUB_REPOSITORY"
